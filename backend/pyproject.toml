[project]
name = "soccer-sim"
version = "1.0.0"
description = "Turn-based 5v5 physics soccer game simulation"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "httpx>=0.26.0",
    "python-dotenv>=1.0.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.26.0",
    "pyright>=1.1.350",
]
rl = [
    # Apple Silicon / Linux / Windows: current torch.
    # Intel/Rosetta macOS: last wheel series (2.2.x) + NumPy 1.x.
    "torch>=2.2.2; platform_machine != 'x86_64' or sys_platform != 'darwin'",
    "torch==2.2.2; platform_machine == 'x86_64' and sys_platform == 'darwin'",
    "numpy>=1.26.0,<2.0; platform_machine == 'x86_64' and sys_platform == 'darwin'",
    "tensorboard>=2.15.0",
]

[tool.uv]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sim", "api"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
include = ["sim", "api", "tests"]
exclude = ["**/__pycache__"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
